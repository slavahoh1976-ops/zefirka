<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зефирка — меню тортов и десертов</title>
<meta name="description" content="Торты и десерты на заказ: начинки, цены и фото работ.">
<meta property="og:title" content="Зефирка — сладости для радости">
<meta property="og:description" content="Торты и десерты на заказ: меню, цены и фото работ">
<meta property="og:image" content="logo-big.png">
<meta name="theme-color" content="#fbf6f2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f2;--card:#fff;--plum:#5b2a45;--plum2:#7a3b5c;--rose:#d98aa0;--rose-l:#f8e6ea;--gold:#c9a36a;--lav:#a58bc4;--ink:#3d2733;--mute:#8d7480;--line:#efe2dc}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;
  background-image:radial-gradient(circle at 0 0,#f9e3e9 0,transparent 38%),radial-gradient(circle at 100% 18%,#efe6f6 0,transparent 32%),radial-gradient(circle at 50% 100%,#f8eedd 0,transparent 40%);background-attachment:fixed}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.hero{text-align:center;padding:calc(26px + env(safe-area-inset-top)) 0 10px}
.hero img{width:min(320px,74vw);height:auto;display:block;margin:0 auto}
.hero .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:var(--plum2);margin:4px 0 0}
.hero .city{color:var(--mute);font-size:14px;margin-top:2px}
.contacts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 8px}
.cbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--plum);box-shadow:0 4px 14px rgba(91,42,69,.07)}
.cbtn.main{background:var(--plum);color:#fff;border-color:var(--plum)}
.cbtn svg{width:18px;height:18px}
.orn{display:flex;align-items:center;gap:14px;justify-content:center;margin:30px 0 16px}
.orn::before,.orn::after{content:"";height:1px;flex:1;max-width:160px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(90deg,var(--gold),transparent)}
.orn h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;color:var(--plum);margin:0;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;justify-content:safe center}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px;color:var(--plum);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.item{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(91,42,69,.08);border:1px solid #f4e9e5;display:flex;flex-direction:column}
.gal{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#f8e6ea,#f3ecf8)}
.gal .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.gal .sl::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;cursor:zoom-in}
.gal .ph0{display:flex;align-items:center;justify-content:center;height:100%;font-size:54px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}.dots i.on{background:#fff}
.cat{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:var(--plum);font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:'Cormorant Garamond',serif;font-size:27px;line-height:1.1;margin:0 0 6px;color:var(--plum);font-weight:700}
.desc{color:#6d5662;font-size:14.5px;margin:0 0 12px;white-space:pre-line;flex:1}
.pr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.price{font-size:22px;font-weight:800;color:var(--plum)}.price small{font-size:13px;color:var(--mute);font-weight:600}
.min{font-size:12.5px;color:var(--mute)}
.order{border:0;background:var(--rose);color:#fff;font-weight:800;font-size:14.5px;padding:11px 18px;border-radius:99px;cursor:pointer;text-decoration:none;white-space:nowrap}
.order:hover{background:#c97590}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.works img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;cursor:zoom-in;display:block;background:var(--rose-l)}
.note{max-width:640px;margin:0 auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 22px;color:#6d5662;white-space:pre-line}
footer{text-align:center;color:var(--mute);font-size:13px;padding:30px 0 calc(30px + env(safe-area-inset-bottom))}
.lb{position:fixed;inset:0;background:rgba(30,12,22,.92);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:12px}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-size:16px}
.pvbar{position:sticky;top:0;z-index:5;background:#5b2a45;color:#fff;text-align:center;font-size:13px;padding:8px}
@media (max-width:520px){.grid{grid-template-columns:1fr}.orn h2{font-size:29px}.body h3{font-size:25px}.works{grid-template-columns:repeat(3,1fr);gap:6px}.works img{border-radius:10px}}

button.cbtn{cursor:pointer;font-family:inherit}
button.order{font-family:inherit}
.of{position:fixed;inset:0;background:rgba(40,16,30,.55);z-index:8;display:none;overflow:auto;padding:24px 12px;align-items:flex-start;justify-content:center}
.of.on{display:flex}
.ofbox{background:#fff;border-radius:24px;width:100%;max-width:560px;padding:0 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ofhead{position:sticky;top:0;z-index:2;background:#fff;display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ofhead h2{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--plum);margin:0;flex:1}
.ofx{border:0;background:var(--rose-l);color:var(--plum);border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;cursor:pointer}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.fg label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--mute)}
.fg input,.fg select,.fg textarea{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fffdfc;width:100%;min-width:0;font-weight:600}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid #f2c3d0;border-color:var(--rose)}
.fg .req i{color:var(--rose);font-style:normal}
.seg2{display:flex;gap:6px}.seg2 label{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;color:var(--plum);font-size:15px}
.seg2 input{width:auto;margin:0}.seg2 label:has(input:checked){background:var(--rose-l);border-color:var(--rose)}
.est{background:linear-gradient(135deg,#f8e6ea,#f3ecf8);border-radius:16px;padding:12px 14px;color:var(--plum);font-weight:700}
.est b{font-size:22px}
.ck2{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:14.5px!important}
.ck2 input{width:22px!important;height:22px;flex-shrink:0}
.sendrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.send{flex:1;border:0;border-radius:99px;padding:14px 16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-width:200px}
.send.tg{background:var(--plum);color:#fff}.send.wa{background:#fff;color:var(--plum);border:1px solid var(--line)}
.send svg{width:20px;height:20px}
.err{color:#c4405f;font-size:13px;font-weight:700;min-height:18px}
.tst{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--plum);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;z-index:12;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.tst.on{opacity:1}
.done{text-align:center;padding:10px 0}
.done .big{font-size:52px}
.done pre{white-space:pre-wrap;text-align:left;background:#fbf6f2;border-radius:14px;padding:12px;font:inherit;font-size:14px;max-height:240px;overflow:auto}
@media (max-width:520px){.of{padding:0}.ofbox{border-radius:0;min-height:100%;padding:0 16px calc(20px + env(safe-area-inset-bottom))}.ofhead{padding-top:calc(12px + env(safe-area-inset-top))}.fg{grid-template-columns:1fr 1fr}.send{min-width:100%}}
</style>
</head>
<body>
<div id="pvbar"></div>
<div class="wrap">
  <header class="hero">
    <img src="logo-big.png" alt="Зефирка — сладости для радости" width="320" height="290">
    <p class="sub" id="sub"></p>
    <div class="city" id="city"></div>
    <div class="contacts" id="contacts"></div>
  </header>
  <main id="main"><div class="empty">Загружаю меню…</div></main>
  <footer id="foot"></footer>
</div>
<div class="lb" id="lb"></div>
<div class="of" id="of"><div class="ofbox" id="ofbox"></div></div>
<div class="tst" id="tst"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>Math.round(n||0).toLocaleString('ru-RU')+' ₽';
const preview=new URLSearchParams(location.search).has('preview');
let pvRaw='';
function loadPreview(){try{const raw=localStorage.getItem('zefirka-menu-preview')||'';if(!raw)return false;if(raw===pvRaw)return true;pvRaw=raw;const j=JSON.parse(raw);D=j;D.shop={...DEF_SHOP,...(D.shop||{})};PD=j.photoData||{};render();return true}catch(e){return false}}
let D=null,PD={},cat='Все';
const src=id=>preview?(PD[id]||''):'menu/'+encodeURIComponent(id)+'.jpg';
const digits=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d};
const IC={wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>',
 tg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.6 18.8 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L7 13l-4.6-1.4c-1-.3-1-1 .2-1.5L20.5 3.3c.9-.3 1.6.2 1.4 1.3z"/></svg>',
 ph:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
 ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
 vk:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.8 17.5c-5.5 0-8.6-3.8-8.8-10h2.8c.1 4.6 2.1 6.5 3.7 6.9V7.5h2.6v3.9c1.6-.2 3.3-2 3.8-3.9h2.6a7.7 7.7 0 0 1-3.5 5 8 8 0 0 1 4.1 5h-2.9c-.6-1.9-2.1-3.3-4.1-3.5v3.5z"/></svg>'};
const DEF_SHOP={title:'Зефирка',tagline:'Сладости для радости',phone:'+7 963 721-08-98',wa:true,tg:'EkaterinaByrsan',channel:'https://t.me/zefirkavkus',orderTo:'tg',note:'Заказ лучше оформить за 3–5 дней. Предоплата 50%.'};
const tgNick=v=>String(v||'').trim().replace(/^@|^https?:\/\/t\.me\//g,'').replace(/\/.*$/,'');
const chUrl=v=>{v=String(v||'').trim();if(!v)return '';if(/^https?:/.test(v))return v;return 'https://t.me/'+v.replace(/^@/,'')};
function orderLink(text){const s=D.shop||{},ph=digits(s.phone),tg=tgNick(s.tg);
  if(tg&&s.orderTo!=='wa')return 'https://t.me/'+tg+'?text='+encodeURIComponent(text);
  if(ph&&s.wa!==false)return 'https://wa.me/'+ph+'?text='+encodeURIComponent(text);
  if(tg)return 'https://t.me/'+tg+'?text='+encodeURIComponent(text);
  if(ph)return 'tel:+'+ph;return null}
function render(){
  const s=D.shop||{};document.title=(s.title||'Зефирка')+' — меню тортов и десертов';
  $('#sub').textContent=s.tagline||'';$('#city').textContent=s.city?'📍 '+s.city:'';
  const ph=digits(s.phone),tg=tgNick(s.tg),c=[],tgFirst=tg&&s.orderTo!=='wa';
  const tgBtn=main=>`<a class="cbtn${main?' main':''}" href="https://t.me/${esc(tg)}?text=${encodeURIComponent('Здравствуйте! Хочу заказать торт.')}" target="_blank" rel="noopener" data-copy="Здравствуйте! Хочу заказать торт.">${IC.tg} Заказать в Telegram</a>`;
  c.push(`<button class="cbtn main" data-orderform="">📝 Оформить заказ</button>`);
  if(tgFirst)c.push(tgBtn(false).replace('Заказать в Telegram','Написать в Telegram'));
  if(ph&&s.wa!==false)c.push(`<a class="cbtn" href="https://wa.me/${ph}" target="_blank" rel="noopener">${IC.wa} WhatsApp</a>`);
  if(tg&&!tgFirst)c.push(tgBtn(false).replace('Заказать в Telegram','Написать в Telegram'));
  if(s.channel)c.push(`<a class="cbtn" href="${esc(chUrl(s.channel))}" target="_blank" rel="noopener">${IC.tg} Наши работы в Telegram</a>`);
  if(ph)c.push(`<a class="cbtn" href="tel:+${ph}">${IC.ph} +${ph.replace(/^(\d)(\d{3})(\d{3})(\d{2})(\d{2})$/,'$1 $2 $3-$4-$5')}</a>`);
  if(s.ig)c.push(`<a class="cbtn" href="https://instagram.com/${esc(String(s.ig).replace(/^@/,''))}" target="_blank" rel="noopener">${IC.ig} Instagram</a>`);
  if(s.vk)c.push(`<a class="cbtn" href="${/^https?:/.test(s.vk)?esc(s.vk):'https://vk.com/'+esc(s.vk)}" target="_blank" rel="noopener">${IC.vk} ВКонтакте</a>`);
  if(s.max)c.push(`<a class="cbtn" href="${/^https?:/.test(s.max)?esc(s.max):'https://max.ru/'+esc(String(s.max).replace(/^@/,''))}" target="_blank" rel="noopener"><b style="font-size:15px">M</b> MAX</a>`);
  $('#contacts').innerHTML=c.join('');
  const items=D.items||[],cats=['Все',...new Set(items.map(i=>i.cat).filter(Boolean))];
  const list=cat==='Все'?items:items.filter(i=>i.cat===cat);
  let h='';
  if(items.length){
    h+=`<div class="orn"><h2>Меню</h2></div>`;
    if(cats.length>2)h+=`<div class="chips">${cats.map(c=>`<button class="chip${c===cat?' on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
    h+=`<div class="grid">${list.map(i=>{const ps=(i.photos||[]).filter(p=>!preview||PD[p]);const link=orderLink(`Здравствуйте! Хочу заказать «${i.name}».`);
      return `<article class="item"><div class="gal">${ps.length?`<div class="sl">${ps.map(p=>`<img src="${src(p)}" data-big="${esc(p)}" alt="${esc(i.name)}" loading="lazy">`).join('')}</div>${ps.length>1?`<div class="dots">${ps.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}`:'<div class="ph0">🍰</div>'}${i.cat?`<span class="cat">${esc(i.cat)}</span>`:''}</div>
      <div class="body"><h3>${esc(i.name)}</h3>${i.desc?`<p class="desc">${esc(i.desc)}</p>`:'<p class="desc"></p>'}
      <div class="pr"><div>${i.price?`<div class="price">${rub(i.price)} <small>/ ${esc(i.unit||'кг')}</small></div>`:''}${i.minQty?`<div class="min">${esc(i.minQty)}</div>`:''}</div><button class="order" data-orderform="${esc(i.id)}">Заказать</button></div></div></article>`}).join('')}</div>`;
  }else h+=`<div class="empty">Меню скоро появится 💗${tgNick(s.tg)?`<br><br>А пока напишите нам в Telegram, и мы всё расскажем`:''}</div>`;
  const g=(D.gallery||[]).filter(p=>!preview||PD[p]);
  if(g.length||s.channel)h+=`<div class="orn"><h2>Наши работы</h2></div>${g.length?`<div class="works">${g.map(p=>`<img src="${src(p)}" data-big="${esc(p)}" alt="Торт Зефирки" loading="lazy">`).join('')}</div>`:''}${s.channel?`<div style="text-align:center;margin-top:16px"><a class="cbtn main" href="${esc(chUrl(s.channel))}" target="_blank" rel="noopener">${IC.tg} Больше работ в нашем Telegram-канале</a></div>`:''}`;
  h+=`<div class="orn"><h2>Как заказать</h2></div><div class="note">${s.note?esc(s.note)+'<br><br>':''}<button class="cbtn main" data-orderform="" style="font-size:16px;padding:13px 22px">📝 Оформить заказ</button><div style="font-size:13px;margin-top:8px">Заполните форму, и готовая заявка откроется в Telegram</div></div>`;
  $('#main').innerHTML=h;
  $('#foot').innerHTML=`${esc(s.title||'Зефирка')} · ${esc(s.tagline||'')}${D.updated?`<br>Меню обновлено ${new Date(D.updated).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}`:''}`;
  document.querySelectorAll('.sl').forEach(sl=>sl.addEventListener('scroll',()=>{const k=Math.round(sl.scrollLeft/sl.clientWidth);sl.parentNode.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===k))},{passive:true}));
}
document.addEventListener('click',e=>{const cp=e.target.closest('[data-copy]');if(cp&&navigator.clipboard){navigator.clipboard.writeText(cp.dataset.copy).catch(()=>{})}
  const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;render();return}
  const im=e.target.closest('img[data-big]');if(im){$('#lb').innerHTML=`<img src="${im.src}" alt=""><button class="lbx" aria-label="Закрыть">×</button>`;$('#lb').classList.add('on');return}
  if(e.target.closest('#lb')){$('#lb').classList.remove('on');$('#lb').innerHTML=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});

/* ===== форма заказа ===== */
const DAY=864e5,pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const WDN=['вс','пн','вт','ср','чт','пт','сб'];
function toast2(t){const e=$('#tst');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)}
function fv(n){const e=document.querySelector('#oform [name="'+n+'"]');return e?(e.type==='checkbox'?e.checked:e.value.trim()):''}
function draftSave(){try{const f=$('#oform');if(!f)return;const d={};new FormData(f).forEach((v,k)=>d[k]=v);d.hasPhoto=fv('hasPhoto');localStorage.setItem('zefirka-order-draft',JSON.stringify(d))}catch(e){}}
function draftLoad(){try{return JSON.parse(localStorage.getItem('zefirka-order-draft')||'{}')}catch(e){return{}}}
function openOrderForm(itemId){
  const s=D.shop||{},items=D.items||[],minDays=Math.max(0,parseInt(s.minDays??3)||0),dr=draftLoad();
  const minDate=ymd(new Date(Date.now()+minDays*DAY));
  const sel=itemId!==''&&itemId!=null?itemId:(dr.item||'');
  $('#ofbox').innerHTML=`<div class="ofhead"><h2>Заказ торта</h2><button class="ofx" data-ofclose>✕ Закрыть</button></div>
  <form id="oform" class="fg" autocomplete="on" novalidate>
    <label class="full">Что хотите заказать<select name="item">${items.map(i=>`<option value="${esc(i.id)}"${i.id===sel?' selected':''}>${esc(i.name)}${i.price?` — ${rub(i.price)}/${esc(i.unit||'кг')}`:''}</option>`).join('')}<option value="other"${sel==='other'||(!items.length)?' selected':''}>Другое / посоветуйте</option></select></label>
    <label class="full">Начинка, вкус<input name="filling" value="${esc(dr.filling||'')}" placeholder="например, шоколад-вишня"></label>
    <label id="qtyL"><span id="qtyLbl">Вес, кг</span><input name="qty" inputmode="decimal" value="${esc(dr.qty||'')}" placeholder="2"></label>
    <label id="guestsL">Сколько гостей<input name="guests" inputmode="numeric" value="${esc(dr.guests||'')}" placeholder="12"></label>
    <label class="req">Дата <i>*</i><input type="date" name="date" min="${minDate}" value="${esc(dr.date&&dr.date>=minDate?dr.date:'')}"></label>
    <label>Время<input type="time" name="time" value="${esc(dr.time||'')}"></label>
    <div class="full"><div class="seg2"><label><input type="radio" name="delivery" value="pickup" ${dr.delivery!=='delivery'?'checked':''}> Самовывоз</label><label><input type="radio" name="delivery" value="delivery" ${dr.delivery==='delivery'?'checked':''}> Доставка</label></div></div>
    <label class="full" id="addrL" style="display:none">Адрес доставки<input name="address" value="${esc(dr.address||'')}" autocomplete="street-address"></label>
    <label class="full">Оформление, цвета, декор<textarea name="decor" rows="2" placeholder="нежно-розовый, ягоды, живые цветы…">${esc(dr.decor||'')}</textarea></label>
    <label class="full">Надпись на торте<input name="inscription" value="${esc(dr.inscription||'')}" placeholder="С днём рождения, Маша!"></label>
    <label class="full ck2"><input type="checkbox" name="hasPhoto" ${dr.hasPhoto?'checked':''}> Есть фото-пример, пришлю в чат</label>
    <label class="req">Ваше имя <i>*</i><input name="name" value="${esc(dr.name||'')}" autocomplete="given-name"></label>
    <label class="req">Телефон <i>*</i><input name="phone" type="tel" inputmode="tel" value="${esc(dr.phone||'')}" autocomplete="tel" placeholder="+7"></label>
    <label class="full">Пожелания, аллергии<textarea name="wishes" rows="2">${esc(dr.wishes||'')}</textarea></label>
    <div class="full est" id="est"></div>
    <div class="full err" id="oerr"></div>
    <div class="full sendrow">${tgNick(s.tg)?`<button type="button" class="send tg" data-send="tg">${IC.tg} Отправить в Telegram</button>`:''}${digits(s.phone)&&s.wa!==false?`<button type="button" class="send wa" data-send="wa">${IC.wa} Отправить в WhatsApp</button>`:''}</div>
    <p class="full" style="font-size:12.5px;color:var(--mute);margin:0">${minDays?`Заказы принимаем не раньше чем за ${minDays} дн. `:''}Окончательную цену подтвердим в переписке.</p>
  </form>`;
  $('#of').classList.add('on');$('#of').scrollTop=0;document.body.style.overflow='hidden';
  try{history.pushState({of:1},'')}catch(e){}
  const f=$('#oform');
  f.addEventListener('input',e=>{if(e.target.name==='guests'){const g=parseInt(e.target.value)||0,it=curItem();if(g&&(!it||(it.unit||'кг')==='кг'))f.qty.value=String(Math.max(1,Math.ceil(g*0.13*2)/2)).replace('.',',')}orderCalc();draftSave()});
  f.addEventListener('change',()=>{orderCalc();draftSave()});
  orderCalc();
}
function curItem(){return (D.items||[]).find(i=>i.id===fv('item'))}
const numv=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isFinite(n)?n:0};
function orderCalc(){
  const it=curItem(),unit=(it&&it.unit)||'кг',isKg=unit==='кг';
  $('#qtyLbl').textContent=isKg?'Вес, кг':'Количество, '+unit;
  $('#guestsL').style.display=isKg?'':'none';
  $('#addrL').style.display=fv('delivery')==='delivery'?'':'none';
  const q=numv(fv('qty'));let h='';
  if(it&&it.price&&q){h=`Примерная стоимость: <b>${rub(it.price*q)}</b>${isKg?` <span style="font-weight:600;font-size:13px">(${String(q).replace('.',',')} кг × ${rub(it.price)})</span>`:''}`;if(it.minQty)h+=`<div style="font-size:13px;font-weight:600">${esc(it.minQty)}</div>`}
  else if(it&&it.minQty)h=esc(it.minQty);
  else h='Укажите вес или число гостей: на гостя обычно 120–150 г торта';
  $('#est').innerHTML=h;
}
function orderText(){
  const it=curItem(),q=numv(fv('qty')),d=fv('date'),unit=(it&&it.unit)||'кг';
  const dd=d?(()=>{const x=new Date(d+'T12:00');return pad2(x.getDate())+'.'+pad2(x.getMonth()+1)+'.'+x.getFullYear()+' ('+WDN[x.getDay()]+')'})():'';
  const L=['🎂 Заявка на заказ — '+((D.shop||{}).title||'Зефирка'),''];
  L.push('Имя: '+fv('name'));L.push('Телефон: '+fv('phone'));
  L.push('Дата: '+dd+(fv('time')?', к '+fv('time'):''));
  L.push('Изделие: '+(it?it.name:'другое / посоветуйте'));
  if(fv('filling'))L.push('Начинка: '+fv('filling'));
  if(q)L.push((unit==='кг'?'Вес: '+String(q).replace('.',',')+' кг':'Количество: '+q+' '+unit)+(fv('guests')?' (гостей: '+fv('guests')+')':''));
  else if(fv('guests'))L.push('Гостей: '+fv('guests'));
  L.push('Получение: '+(fv('delivery')==='delivery'?'Доставка'+(fv('address')?' — '+fv('address'):''):'Самовывоз'));
  if(fv('decor'))L.push('Оформление: '+fv('decor'));
  if(fv('inscription'))L.push('Надпись: '+fv('inscription'));
  if(fv('wishes'))L.push('Пожелания: '+fv('wishes'));
  if(it&&it.price&&q)L.push('Ориентировочно: '+rub(it.price*q));
  if(fv('hasPhoto'))L.push('','📷 Фото-пример пришлю следующим сообщением');
  return L.join('\n');
}
async function sendOrder(via){
  const err=[];if(!fv('name'))err.push('имя');if(digits(fv('phone')).length<11)err.push('телефон');if(!fv('date'))err.push('дату');
  if(err.length){$('#oerr').textContent='Заполните, пожалуйста: '+err.join(', ');return}
  $('#oerr').textContent='';
  const text=orderText(),s=D.shop||{};
  try{await navigator.clipboard.writeText(text)}catch(e){}
  const url=via==='tg'?'https://t.me/'+tgNick(s.tg)+'?text='+encodeURIComponent(text):'https://wa.me/'+digits(s.phone)+'?text='+encodeURIComponent(text);
  const w=window.open(url,'_blank');if(!w)location.href=url;
  $('#ofbox').innerHTML=`<div class="ofhead"><h2>Почти готово!</h2><button class="ofx" data-ofclose>✕ Закрыть</button></div>
  <div class="done"><div class="big">💌</div><p style="font-size:16px;margin:4px 0 10px">Открылся ${via==='tg'?'Telegram':'WhatsApp'} с вашей заявкой.<br><b>Нажмите «Отправить» в чате.</b></p>
  <p style="color:var(--mute);font-size:13.5px">Если текст не подставился, он уже скопирован: просто вставьте его в чат.</p>
  <pre>${esc(text)}</pre>
  <div class="sendrow"><button class="send wa" data-copytext>📋 Скопировать ещё раз</button><a class="send tg" href="${esc(url)}" target="_blank" rel="noopener" style="text-decoration:none">Открыть чат снова</a></div></div>`;
  $('#ofbox')._text=text;
  try{localStorage.removeItem('zefirka-order-draft')}catch(e){}
}
function closeOF(fromPop){if(!$('#of').classList.contains('on'))return;$('#of').classList.remove('on');document.body.style.overflow='';if(!fromPop&&history.state&&history.state.of)history.back()}
window.addEventListener('popstate',()=>closeOF(true));
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-orderform]');if(o){e.preventDefault();openOrderForm(o.dataset.orderform);return}
  if(e.target.closest('[data-ofclose]')||e.target.id==='of'){closeOF();return}
  const sd=e.target.closest('[data-send]');if(sd){sendOrder(sd.dataset.send);return}
  if(e.target.closest('[data-copytext]')){navigator.clipboard.writeText($('#ofbox')._text||'').then(()=>toast2('Скопировано ✓'),()=>toast2('Не получилось скопировать'));return}
});
if(location.hash==='#order')setTimeout(()=>D&&openOrderForm(''),600);

(async()=>{
  if(preview&&loadPreview()){
    $('#pvbar').innerHTML='<div class="pvbar">👁 Черновик меню, обновляется сам при изменениях в программе. Клиенты увидят его после «🌐 Опубликовать».<br><a href="menu.html" style="color:#fff;font-weight:700">Открыть меню, как его видят клиенты →</a></div>';
    window.addEventListener('storage',e=>{if(e.key==='zefirka-menu-preview')loadPreview()});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadPreview()});
    setInterval(loadPreview,3000);
    return}
  try{const r=await fetch('menu.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;D=await r.json();D.shop={...DEF_SHOP,...(D.shop||{})};render()}
  catch(e){D={shop:{...DEF_SHOP},items:[]};render()}
})();
</script>
</body>
</html>
